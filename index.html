<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Low-Poly Racer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #87CEEB; }
    #instructions {
      position: absolute; top: 10px; left: 10px;
      font-family: sans-serif; color: white;
      background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="instructions">Use <b>W A S D</b> or <b>Arrow Keys</b> to drive</div>
  <script src="https://cloudflare.com"></script>
  <script>
    // Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // Track / Ground
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Grid Helper for speed reference
    const grid = new THREE.GridHelper(200, 40, 0xffffff, 0x555555);
    scene.add(grid);

    // Car Mesh
    const carGeo = new THREE.BoxGeometry(1.5, 0.8, 3);
    const carMat = new THREE.MeshLambertMaterial({ color: 0xff3333 });
    const car = new THREE.Mesh(carGeo, carMat);
    car.position.y = 0.4;
    scene.add(car);

    // Driving Physics Variables
    let speed = 0;
    let angle = 0;
    const keys = {};

    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    function animate() {
      requestAnimationFrame(animate);

      // Acceleration & Braking
      if (keys['w'] || keys['arrowup']) speed += 0.015;
      if (keys['s'] || keys['arrowdown']) speed -= 0.015;
      speed *= 0.96; // Friction

      // Steering
      if (Math.abs(speed) > 0.01) {
        const turnDir = speed > 0 ? 1 : -1;
        if (keys['a'] || keys['arrowleft']) angle += 0.04 * turnDir;
        if (keys['d'] || keys['arrowright']) angle -= 0.04 * turnDir;
      }

      // Update Car Position
      car.rotation.y = angle;
      car.position.x -= Math.sin(angle) * speed;
      car.position.z -= Math.cos(angle) * speed;

      // Smooth Follow Camera
      camera.position.x = car.position.x + Math.sin(angle) * 7;
      camera.position.y = car.position.y + 3.5;
      camera.position.z = car.position.z + Math.cos(angle) * 7;
      camera.lookAt(car.position);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
